<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hanu Collection - Business Dashboard</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#581c3f">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .bg-maroon { background-color: #581c3f; }
        .text-maroon { color: #581c3f; }
        .btn-tab-active { background-color: #581c3f; color: white; }
        .btn-tab-inactive { background-color: #f3ecef; color: #581c3f; }
    </style>

    <script>
      const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzbgBrocHpKqPQkoE2uw5dzuSl310VTbq2mSTG8OMbG8iUNtHjnGXm4wW1IkwyGbyAQ/exec";
      let storeData = { products: [], sales: [], expenses: [], purchases: [] };

      async function fetchAllData() {
        const statusEl = document.getElementById('syncStatus');
        if (statusEl) statusEl.innerText = "Syncing...";

        try {
          const res = await fetch(GOOGLE_SCRIPT_URL, { redirect: "follow" });
          const json = await res.json();

          if (json) {
            storeData.products = Array.isArray(json.products) ? json.products : [];
            storeData.sales = Array.isArray(json.sales) ? json.sales : [];
            storeData.expenses = Array.isArray(json.expenses) ? json.expenses : [];
            storeData.purchases = Array.isArray(json.purchases) ? json.purchases : [];

            calculateDashboard();
            renderAllTables();

            if (statusEl) {
              statusEl.innerText = "Synced with Google Sheets";
              statusEl.className = "text-xs text-emerald-300 font-medium";
            }
          }
        } catch (e) {
          console.error("Error fetching data:", e);
          if (statusEl) {
            statusEl.innerText = "Sync Error";
            statusEl.className = "text-xs text-rose-300 font-medium";
          }
        }
      }

      function switchTab(tabName) {
        ['Dashboard', 'Products', 'Sales', 'Expenses', 'Purchases'].forEach(t => {
          const btn = document.getElementById(`tab-${t}`);
          const content = document.getElementById(`content-${t}`);
          if (btn) btn.className = (t === tabName) ? "btn-tab-active px-4 py-2 rounded-xl font-medium text-sm transition" : "btn-tab-inactive px-4 py-2 rounded-xl font-medium text-sm hover:bg-gray-200 transition";
          if (content) content.classList.toggle('hidden', t !== tabName);
        });
      }

      async function submitForm(event, tabName, formId) {
        event.preventDefault();
        const form = document.getElementById(formId);
        const formData = new FormData(form);
        let rowData = [];
        const today = new Date().toISOString().split('T')[0];

        if (tabName === "Sales Register") {
          rowData = [formData.get('date') || today, formData.get('article'), formData.get('product'), Number(formData.get('qty'))||1, Number(formData.get('price'))||0, 0, Number(formData.get('salesValue'))||0, 0, Number(formData.get('cogs'))||0, 0, formData.get('customer')||'', ''];
        } else if (tabName === "Expenses") {
          rowData = [formData.get('date') || today, formData.get('type') || '', formData.get('description') || '', Number(formData.get('amount')) || 0];
        } else if (tabName === "Purchase Bills") {
          rowData = ['', formData.get('date') || today, formData.get('supplier') || '', '', formData.get('description') || '', Number(formData.get('qty')) || 0, Number(formData.get('rate')) || 0, 0, 0, 0, 0, Number(formData.get('total')) || 0];
        }

        const submitBtn = form.querySelector('button[type="submit"]');
        submitBtn.innerText = "Saving...";
        submitBtn.disabled = true;

        try {
          await fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify({ action: "add", tab: tabName, rowData: rowData })
          });
          alert("Entry added successfully!");
          form.reset();
          setTimeout(fetchAllData, 2000);
        } catch (err) {
          alert("Error saving entry.");
        } finally {
          submitBtn.innerText = "Save";
          submitBtn.disabled = false;
        }
      }

      async function deleteRow(tabName, rowIndex) {
        if (!confirm("Are you sure you want to delete this entry?")) return;
        try {
          await fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify({ action: "delete", tab: tabName, rowIndex: rowIndex })
          });
          alert("Deleted successfully!");
          setTimeout(fetchAllData, 2000);
        } catch (e) {
          alert("Error deleting entry.");
        }
      }

        if (storeData.sales.length > 1) {
          storeData.sales.slice(1).forEach(row => { actualSales += parseFloat(row[6]) || 0; costOfGoodsSold += parseFloat(row[8]) || 0; });
        }
        if (storeData.expenses.length > 1) {
          storeData.expenses.slice(1).forEach(row => { totalExpenses += parseFloat(row[3]) || 0; });
        }
        if (storeData.purchases.length > 1) {
          storeData.purchases.slice(1).forEach(row => { totalInvestment += parseFloat(row[11]) || 0; });
        }

        let grossProfit = actualSales - costOfGoodsSold;
        let netProfit = grossProfit - totalExpenses;
        let stockCostRemaining = totalInvestment - costOfGoodsSold;

        document.getElementById('dashSales').innerText = `₹${actualSales.toLocaleString('en-IN', {minimumFractionDigits: 2})}`;
        document.getElementById('dashGrossProfit').innerText = `₹${grossProfit.toLocaleString('en-IN', {minimumFractionDigits: 2})}`;
        document.getElementById('dashExpenses').innerText = `₹${totalExpenses.toLocaleString('en-IN', {minimumFractionDigits: 2})}`;
        document.getElementById('dashNetProfit').innerText = `₹${netProfit.toLocaleString('en-IN', {minimumFractionDigits: 2})}`;
